<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escape Games — English Language Learning</title>
  <meta name="description" content="Interactive escape room games to practice English. Immersive scenarios for language learners at all levels." />
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      /* Professional Deep Blue Palette with Gold Accents */
      --bg-gradient: linear-gradient(135deg, #0a1428 0%, #1a2a4a 50%, #0f1f3c 100%);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-hover-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover-border: rgba(255, 215, 0, 0.3);
      
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      
      --accent-gold: #ffd700;
      --accent-gold-hover: #ffed4e;
      --accent-blue: #3b82f6;
      
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, Ubuntu, Cantarell, sans-serif;
      color: var(--text-main);
      background: var(--bg-gradient);
      background-attachment: fixed;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(10, 20, 40, 0.8) 0%, rgba(10, 20, 40, 0.4) 100%);
      backdrop-filter: blur(8px);
    }

    .header-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 32px;
    }

    @media (min-width: 768px) {
      .header-content {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .header-text h1 {
      margin: 0 0 8px 0;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text p {
      margin: 0;
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .controls {
        width: 340px;
        flex-shrink: 0;
      }
    }

    .search-wrapper {
      position: relative;
    }

    .search {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .search:focus {
      border-color: var(--accent-gold);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.15);
    }

    .search::placeholder {
      color: rgba(148, 163, 184, 0.6);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    /* Filter Tags */
    .filter-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 215, 0, 0.3);
      color: var(--accent-gold);
    }

    .filter-btn.active {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #0a1428;
      font-weight: 600;
    }

    /* Main Content */
    main {
      padding: 48px 0;
    }

    .loading, .empty, .error {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .loading {
      font-size: 1.1rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-lg);
      padding: 40px 20px;
      color: #fca5a5;
    }

    /* Exercise Grid */
    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    @media (min-width: 640px) {
      .exercise-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .exercise-grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
    }

    .exercise-grid li {
      margin: 0;
      list-style: none;
    }

    /* Exercise Card */
    .exercise-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      text-decoration: none;
      padding: 24px;
      border-radius: var(--radius-lg);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .exercise-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-blue));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .exercise-card:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .exercise-card:hover::before {
      transform: scaleX(1);
    }

    .exercise-card:focus-visible {
      outline: 2px solid var(--accent-gold);
      outline-offset: 2px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-main);
      line-height: 1.3;
      flex: 1;
    }

    .difficulty-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      white-space: nowrap;
      color: #0a1428;
    }

    .difficulty-beginner {
      background: #10b981;
    }

    .difficulty-intermediate {
      background: #f59e0b;
    }

    .difficulty-advanced {
      background: var(--accent-gold);
    }

    .difficulty-expert {
      background: #ef4444;
    }

    .difficulty-unset {
      background: var(--text-muted);
    }

    .card-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      flex: 1;
      line-height: 1.5;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-cta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-gold);
      font-weight: 500;
      transition: var(--transition);
    }

    .exercise-card:hover .card-cta {
      color: var(--accent-gold-hover);
      gap: 10px;
    }

    /* Footer */
    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 32px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .footer-stats {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .footer-stats strong {
      color: var(--accent-gold);
    }

    /* Accessibility */
    .skip {
      position: absolute;
      left: -9999px;
      top: -9999px;
      z-index: -1;
    }

    .skip:focus {
      left: 20px;
      top: 20px;
      background: var(--accent-gold);
      color: #0a1428;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      z-index: 1000;
      outline: none;
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <header>
    <div class="container">
      <div class="header-content">
        <div class="header-text">
          <h1>Escape Games</h1>
          <p>Immersive English learning through interactive scenarios</p>
        </div>

        <div class="controls" role="search">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input 
              id="search" 
              class="search" 
              type="search" 
              placeholder="Search exercises…" 
              aria-label="Search exercises"
              autocomplete="off"
            />
          </div>
          <div class="filter-tags">
            <button class="filter-btn active" data-difficulty="all">All Levels</button>
            <button class="filter-btn" data-difficulty="beginner">Beginner</button>
            <button class="filter-btn" data-difficulty="intermediate">Intermediate</button>
            <button class="filter-btn" data-difficulty="advanced">Advanced</button>
            <button class="filter-btn" data-difficulty="expert">Expert</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <ul id="exercises" class="exercise-grid" aria-live="polite" aria-busy="true">
      <li class="loading">Loading exercises…</li>
    </ul>
  </main>

  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-stats">
          Showing <strong id="count">0</strong> of <strong id="total">0</strong> exercises
        </div>
        <div>© 2024 Escape Games. English learning through immersion.</div>
      </div>
    </div>
  </footer>

  <script>
    (function() {
      const searchInput = document.getElementById('search');
      const exercisesList = document.getElementById('exercises');
      const countSpan = document.getElementById('count');
      const totalSpan = document.getElementById('total');
      const filterBtns = document.querySelectorAll('.filter-btn');

      let exercises = [];
      let filteredExercises = [];
      let currentDifficulty = 'all';

      /**
       * Parse difficulty from filename
       * Expected format: exercise-name-difficulty.html
       * Difficulty: beginner, intermediate, advanced, expert
       */
      function extractDifficulty(filename) {
        const name = filename.replace(/\.html$/i, '');
        const match = name.match(/-(beginner|intermediate|advanced|expert)$/i);
        return match ? match[1].toLowerCase() : null;
      }

      /**
       * Format title from filename
       * Converts: my-exercise-name-difficulty.html → My Exercise Name
       */
      function formatTitle(filename) {
        let title = filename.replace(/\.html$/i, '');
        title = title.replace(/-(beginner|intermediate|advanced|expert)$/i, '');
        title = title.replace(/-/g, ' ');
        return title.split(' ')
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');
      }

      /**
       * Get difficulty badge info
       */
      function getDifficultyInfo(difficulty) {
        const map = {
          'beginner': { label: 'Beginner', class: 'difficulty-beginner' },
          'intermediate': { label: 'Intermediate', class: 'difficulty-intermediate' },
          'advanced': { label: 'Advanced', class: 'difficulty-advanced' },
          'expert': { label: 'Expert', class: 'difficulty-expert' }
        };
        return map[difficulty] || { label: '—', class: 'difficulty-unset' };
      }

      /**
       * Create exercise card HTML
       */
      function createExerciseCard(exercise) {
        const difficultyInfo = getDifficultyInfo(exercise.difficulty);
        return `
          <a href="${escapeHtml(exercise.filename)}" class="exercise-card" role="link">
            <div class="card-header">
              <span class="card-title">${escapeHtml(exercise.title)}</span>
              <span class="difficulty-badge ${difficultyInfo.class}">
                ${difficultyInfo.label}
              </span>
            </div>
            <div class="card-meta">
              <span>Interactive Scenario</span>
              <span class="card-cta">Start →</span>
            </div>
          </a>
        `;
      }

      /**
       * Escape HTML to prevent XSS
       */
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      /**
       * Update exercise count
       */
      function updateCounts() {
        const visible = exercises.filter(ex => ex.visible).length;
        countSpan.textContent = visible;
        totalSpan.textContent = exercises.length;
      }

      /**
       * Apply filters (search + difficulty)
       */
      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();

        exercises.forEach(exercise => {
          const matchesSearch = query === '' || 
            exercise.title.toLowerCase().includes(query) ||
            (exercise.difficulty && exercise.difficulty.toLowerCase().includes(query));
          
          const matchesDifficulty = currentDifficulty === 'all' || 
            exercise.difficulty === currentDifficulty;

          exercise.visible = matchesSearch && matchesDifficulty;
        });

        renderExercises();
        updateCounts();
      }

      /**
       * Render exercises to DOM
       */
      function renderExercises() {
        const visible = exercises.filter(ex => ex.visible);

        if (exercises.length === 0) {
          exercisesList.innerHTML = '<li class="empty">No exercises found. Check back soon!</li>';
          return;
        }

        if (visible.length === 0) {
          exercisesList.innerHTML = '<li class="empty">No exercises match your filters.</li>';
          return;
        }

        exercisesList.innerHTML = visible
          .map(exercise => `<li>${createExerciseCard(exercise)}</li>`)
          .join('');
      }

      /**
       * Debounce function for search input
       */
      function debounce(fn, delay) {
        let timeoutId;
        return function(...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => fn.apply(this, args), delay);
        };
      }

      /**
       * Event Listeners
       */
      searchInput.addEventListener('input', debounce(applyFilters, 200));

      filterBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          filterBtns.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentDifficulty = e.target.getAttribute('data-difficulty');
          applyFilters();
        });
      });

      // Keyboard shortcut: / to focus search
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      });

      /**
       * Fetch exercises from repository
       */
      async function loadExercises() {
        try {
          exercisesList.setAttribute('aria-busy', 'true');
          
          const response = await fetch(
            'https://api.github.com/repos/Balmain-English/escape-games/contents?t=' + Date.now(),
            {
              headers: {
                'Accept': 'application/vnd.github.v3+json'
              }
            }
          );

          if (!response.ok) {
            throw new Error(`Failed to fetch: ${response.status}`);
          }

          const files = await response.json();

          // Filter for HTML exercise files
          // Exclude: index.html, README, and files starting with common config names
          const htmlFiles = (files || [])
            .filter(f => 
              f.type === 'file' && 
              f.name.endsWith('.html') &&
              !/^index\.html$/i.test(f.name) &&
              !/^(README|CHANGELOG|LICENSE|styles|favicon)/i.test(f.name)
            )
            .sort((a, b) => a.name.localeCompare(b.name));

          exercises = htmlFiles.map(file => ({
            filename: file.name,
            title: formatTitle(file.name),
            difficulty: extractDifficulty(file.name),
            visible: true
          }));

          exercisesList.setAttribute('aria-busy', 'false');
          
          if (exercises.length === 0) {
            exercisesList.innerHTML = '<li class="empty">No exercises available yet. Check back soon!</li>';
            totalSpan.textContent = '0';
          } else {
            applyFilters();
          }
        } catch (error) {
          console.error('Error loading exercises:', error);
          exercisesList.setAttribute('aria-busy', 'false');
          exercisesList.innerHTML = `
            <li class="error">
              <strong>Unable to load exercises</strong><br>
              <small>${escapeHtml(error.message)}</small>
            </li>
          `;
        }
      }

      // Load exercises on page load
      loadExercises();
    })();
  </script>
</body>
</html>
