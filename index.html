<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escape Games — English Language Learning</title>
  <meta name="description" content="Interactive escape room games to practice English. Immersive scenarios for language learners at all levels." />
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      color-scheme: dark;
      --page: #0b1425;
      --surface: rgba(18, 32, 55, .82);
      --surface-hover: rgba(29, 48, 76, .92);
      --border: rgba(192, 211, 240, .13);
      --text: #f3f6fc;
      --muted: #9cacc4;
      --gold: #f5c84c;
      --blue: #70a5ff;
      --radius: 14px;
      --ease: 180ms ease;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      color: var(--text);
      background: radial-gradient(ellipse at 50% -20%, #20375e 0, transparent 52%), var(--page);
      font: 14px/1.5 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, Ubuntu, Cantarell, sans-serif;
    }
    .container { width: min(1280px, 100% - 40px); margin-inline: auto; }
    .site-header {
      padding: 22px 0 18px;
      background: rgba(8, 17, 32, .78);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .16);
    }
    .header-content { display: grid; grid-template-columns: minmax(210px, 1fr) minmax(340px, 440px); align-items: center; gap: 28px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid; width: 42px; height: 42px; flex: 0 0 42px; place-items: center;
      border: 1px solid rgba(245, 200, 76, .35); border-radius: 13px;
      background: linear-gradient(145deg, rgba(245, 200, 76, .2), rgba(112, 165, 255, .13));
      color: var(--gold); font-size: 21px;
    }
    h1 { margin: 0; font-size: clamp(1.25rem, 2vw, 1.65rem); line-height: 1.15; letter-spacing: -.035em; }
    .tagline { margin: 5px 0 0; color: var(--muted); font-size: .84rem; }
    .controls { display: grid; gap: 9px; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; top: 50%; left: 13px; transform: translateY(-50%); pointer-events: none; opacity: .7; }
    .search {
      width: 100%; height: 39px; padding: 0 14px 0 38px; border: 1px solid var(--border);
      border-radius: 10px; outline: none; background: rgba(255,255,255,.055); color: var(--text);
      font: inherit; font-size: .85rem; transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
    }
    .search::placeholder { color: #8494ad; }
    .search:focus { border-color: rgba(245, 200, 76, .72); background: rgba(255,255,255,.08); box-shadow: 0 0 0 3px rgba(245,200,76,.12); }
    .filter-tags { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .filter-btn {
      min-width: 0; padding: 6px 5px; border: 1px solid var(--border); border-radius: 8px;
      background: rgba(255,255,255,.035); color: #c1ccdc; font: inherit; font-size: .74rem;
      line-height: 1.2; white-space: nowrap; cursor: pointer; transition: var(--ease);
    }
    .filter-btn:hover { border-color: rgba(245,200,76,.46); background: rgba(245,200,76,.08); color: var(--gold); }
    .filter-btn.active { border-color: var(--gold); background: var(--gold); color: #152039; font-weight: 700; }
    .filter-btn:focus-visible, .exercise-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    main { min-height: calc(100vh - 190px); padding: 26px 0 38px; }
    .exercise-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; list-style: none; padding: 0; margin: 0; }
    .exercise-grid li { min-width: 0; margin: 0; }
    .exercise-card {
      position: relative; display: flex; min-height: 105px; height: 100%; flex-direction: column; justify-content: space-between;
      overflow: hidden; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: inherit; text-decoration: none;
      box-shadow: 0 5px 18px rgba(0,0,0,.12); transition: transform var(--ease), border-color var(--ease), background var(--ease), box-shadow var(--ease);
    }
    .exercise-card::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: linear-gradient(var(--gold), var(--blue)); content: ''; opacity: 0; transition: opacity var(--ease); }
    .exercise-card:hover { transform: translateY(-2px); border-color: rgba(245,200,76,.42); background: var(--surface-hover); box-shadow: 0 10px 24px rgba(0,0,0,.24); }
    .exercise-card:hover::before { opacity: 1; }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 9px; }
    .card-title { min-width: 0; font-size: .9rem; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
    .difficulty-badge { flex: 0 0 auto; padding: 3px 7px; border-radius: 6px; color: #142039; font-size: .65rem; line-height: 1.2; font-weight: 800; }
    .difficulty-a1 { background: #54d6a0; } .difficulty-a2 { background: #36c58a; }
    .difficulty-b1 { background: #f3b949; } .difficulty-b2 { background: #f5d166; }
    .difficulty-c1 { background: #f3de61; } .difficulty-c2 { background: #ff8585; }
    .difficulty-unset { background: #a7b3c5; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 13px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.08); color: var(--muted); font-size: .72rem; }
    .card-cta { color: var(--gold); font-weight: 650; white-space: nowrap; }
    .exercise-card:hover .card-cta { color: #ffe28a; }
    .loading, .empty, .error { grid-column: 1 / -1; padding: 38px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: rgba(255,255,255,.035); color: var(--muted); text-align: center; }
    .loading { animation: pulse 1.8s ease-in-out infinite; }
    .error { border-color: rgba(239,68,68,.3); color: #ffb4b4; background: rgba(239,68,68,.08); }
    @keyframes pulse { 50% { opacity: .58; } }
    footer { padding: 15px 0 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: .74rem; text-align: center; }
    .footer-content { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 20px; }
    .footer-stats { color: #c7d2e2; }
    .footer-stats strong { color: var(--gold); }
    .skip { position: absolute; left: -9999px; top: 8px; z-index: 10; padding: 8px 12px; border-radius: 8px; background: var(--gold); color: #152039; }
    .skip:focus { left: 12px; }
    @media (max-width: 760px) {
      .container { width: min(100% - 32px, 620px); }
      .header-content { grid-template-columns: 1fr; gap: 15px; }
      .site-header { padding: 17px 0; }
      main { min-height: auto; padding: 20px 0 28px; }
      .exercise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .exercise-card { min-height: 96px; padding: 12px; }
    }
    @media (max-width: 420px) {
      .container { width: min(100% - 24px, 620px); }
      .exercise-grid { grid-template-columns: 1fr; }
      .exercise-card { min-height: 84px; }
      .brand-mark { width: 38px; height: 38px; flex-basis: 38px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container header-content">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div class="header-text">
          <h1>Escape Games</h1>
          <p class="tagline">Immersive English learning through interactive scenarios</p>
        </div>
      </div>
      <div class="controls" role="search">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" class="search" type="search" placeholder="Search exercises…" aria-label="Search exercises" autocomplete="off" />
        </div>
        <div class="filter-tags" aria-label="Filter by English level">
          <button type="button" class="filter-btn active" data-level="all" aria-pressed="true">All Levels</button>
          <button type="button" class="filter-btn" data-level="a1" aria-pressed="false">A1</button>
          <button type="button" class="filter-btn" data-level="a2" aria-pressed="false">A2</button>
          <button type="button" class="filter-btn" data-level="b1" aria-pressed="false">B1</button>
          <button type="button" class="filter-btn" data-level="b2" aria-pressed="false">B2</button>
          <button type="button" class="filter-btn" data-level="c1" aria-pressed="false">C1</button>
          <button type="button" class="filter-btn" data-level="c2" aria-pressed="false">C2</button>
        </div>
      </div>
    </div>
  </header>
  <main id="main" class="container">
    <ul id="exercises" class="exercise-grid" aria-live="polite" aria-busy="true">
      <li class="loading">Loading exercises…</li>
    </ul>
  </main>
  <footer>
    <div class="container footer-content">
      <div class="footer-stats">Showing <strong id="count">0</strong> of <strong id="total">0</strong> exercises</div>
      <div>© 2024 Escape Games · English learning through immersion</div>
    </div>
  </footer>
  <script>
    (function() {
      const searchInput = document.getElementById('search');
      const exercisesList = document.getElementById('exercises');
      const countSpan = document.getElementById('count');
      const totalSpan = document.getElementById('total');
      const filterBtns = document.querySelectorAll('.filter-btn');
      let exercises = [];
      let currentLevel = 'all';

      function extractLevel(filename) {
        const match = filename.replace(/\.html$/i, '').match(/-(a1|a2|b1|b2|c1|c2)$/i);
        return match ? match[1].toLowerCase() : null;
      }
      function formatTitle(filename) {
        return filename.replace(/\.html$/i, '').replace(/-(a1|a2|b1|b2|c1|c2)$/i, '')
          .replace(/-/g, ' ').split(' ')
          .map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
      }
      function getLevelInfo(level) {
        const map = {
          a1: { label: 'A1', class: 'difficulty-a1' }, a2: { label: 'A2', class: 'difficulty-a2' },
          b1: { label: 'B1', class: 'difficulty-b1' }, b2: { label: 'B2', class: 'difficulty-b2' },
          c1: { label: 'C1', class: 'difficulty-c1' }, c2: { label: 'C2', class: 'difficulty-c2' }
        };
        return map[level] || { label: '—', class: 'difficulty-unset' };
      }
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
      function createExerciseCard(exercise) {
        const levelInfo = getLevelInfo(exercise.level);
        return `<a href="${escapeHtml(exercise.filename)}" class="exercise-card">
          <div class="card-header"><span class="card-title">${escapeHtml(exercise.title)}</span>
          <span class="difficulty-badge ${levelInfo.class}">${levelInfo.label}</span></div>
          <div class="card-meta"><span>Interactive Scenario</span><span class="card-cta">Explore&nbsp; →</span></div>
        </a>`;
      }
      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        const visible = exercises.filter(exercise => {
          const matchesSearch = !query || exercise.title.toLowerCase().includes(query) ||
            (exercise.level && exercise.level.includes(query));
          return matchesSearch && (currentLevel === 'all' || exercise.level === currentLevel);
        });
        countSpan.textContent = visible.length;
        totalSpan.textContent = exercises.length;
        if (!exercises.length) {
          exercisesList.innerHTML = '<li class="empty">No exercises available yet. Check back soon!</li>';
        } else if (!visible.length) {
          exercisesList.innerHTML = '<li class="empty">No exercises match your filters.</li>';
        } else {
          exercisesList.innerHTML = visible.map(exercise => `<li>${createExerciseCard(exercise)}</li>`).join('');
        }
      }
      function debounce(fn, delay) {
        let timeoutId;
        return function(...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => fn.apply(this, args), delay);
        };
      }
      searchInput.addEventListener('input', debounce(applyFilters, 180));
      filterBtns.forEach(btn => btn.addEventListener('click', event => {
        filterBtns.forEach(button => {
          button.classList.remove('active');
          button.setAttribute('aria-pressed', 'false');
        });
        event.currentTarget.classList.add('active');
        event.currentTarget.setAttribute('aria-pressed', 'true');
        currentLevel = event.currentTarget.getAttribute('data-level');
        applyFilters();
      }));
      window.addEventListener('keydown', event => {
        if (event.key === '/' && document.activeElement !== searchInput) {
          event.preventDefault();
          searchInput.focus();
        }
      });
      async function loadExercises() {
        try {
          exercisesList.setAttribute('aria-busy', 'true');
          const response = await fetch('https://api.github.com/repos/Balmain-English/escape-games/contents?t=' + Date.now(), {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });
          if (!response.ok) throw new Error(`Failed to fetch: ${response.status}`);
          const files = await response.json();
          exercises = (files || []).filter(file =>
            file.type === 'file' && file.name.endsWith('.html') &&
            !/^index\.html$/i.test(file.name) && !/^(README|CHANGELOG|LICENSE|styles|favicon)/i.test(file.name)
          ).sort((a, b) => a.name.localeCompare(b.name)).map(file => ({
            filename: file.name, title: formatTitle(file.name), level: extractLevel(file.name)
          }));
          exercisesList.setAttribute('aria-busy', 'false');
          applyFilters();
        } catch (error) {
          console.error('Error loading exercises:', error);
          exercisesList.setAttribute('aria-busy', 'false');
          exercisesList.innerHTML = `<li class="error"><strong>Unable to load exercises</strong><br><small>${escapeHtml(error.message)}</small></li>`;
        }
      }
      loadExercises();
    })();
  </script>
</body>
</html>
