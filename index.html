<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escape Games — English Language Learning</title>
  <meta name="description" content="Interactive escape room games to practice English. Immersive scenarios for language learners at all levels." />
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a1428 0%, #1a2a4a 50%, #0f1f3c 100%);
      --card-bg: rgba(255,255,255,.04);
      --card-hover-bg: rgba(255,255,255,.08);
      --card-border: rgba(255,255,255,.1);
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-gold: #ffd700;
      --accent-gold-hover: #ffed4e;
      --accent-blue: #3b82f6;
      --radius-full: 9999px;
      --transition: all .2s ease;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      min-height: 100vh; margin: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, Ubuntu, Cantarell, sans-serif;
      color: var(--text-main); background: var(--bg-gradient); background-attachment: fixed;
      font-size: 13px; line-height: 1.4;
    }
    .container { max-width: 1440px; margin: 0 auto; padding: 0 16px; }
    header {
      padding: 16px 0 12px; border-bottom: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(10,20,40,.8), rgba(10,20,40,.4));
      backdrop-filter: blur(8px);
    }
    .header-content { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    @media (min-width: 768px) {
      .header-content { flex-direction: row; align-items: center; }
      .controls { width: 380px; flex-shrink: 0; }
    }
    .header-text h1 {
      margin: 0 0 3px; font-size: clamp(1.05rem, 1.8vw, 1.3rem); font-weight: 700;
      letter-spacing: -.02em; background: linear-gradient(135deg, #fff, #cbd5e1);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-text p { margin: 0; font-size: .75rem; color: var(--text-muted); }
    .controls { display: flex; flex-direction: column; gap: 7px; width: 100%; }
    .search-wrapper { position: relative; }
    .search {
      width: 100%; padding: 7px 10px 7px 32px; border-radius: var(--radius-full);
      border: 1px solid var(--card-border); background: rgba(255,255,255,.06);
      color: var(--text-main); font-size: .78rem; outline: none; transition: var(--transition);
    }
    .search:focus { border-color: var(--accent-gold); background: rgba(255,255,255,.1); box-shadow: 0 0 0 3px rgba(255,215,0,.15); }
    .search::placeholder { color: rgba(148,163,184,.7); }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: .75rem; pointer-events: none; }
    .filter-tags { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .filter-btn {
      min-width: 0; padding: 4px 5px; border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--radius-full); background: rgba(255,255,255,.05);
      color: var(--text-secondary); font: inherit; font-size: .68rem; line-height: 1.2;
      white-space: nowrap; cursor: pointer; transition: var(--transition);
    }
    .filter-btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,215,0,.3); color: var(--accent-gold); }
    .filter-btn.active { background: var(--accent-gold); border-color: var(--accent-gold); color: #0a1428; font-weight: 600; }
    .filter-btn:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }
    main { padding: 20px 0; }
    .loading, .empty, .error { text-align: center; padding: 28px 14px; color: var(--text-muted); }
    .loading { font-size: .82rem; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
    .error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); border-radius: 14px; padding: 22px 14px; color: #fca5a5; }
    .exercise-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; list-style: none; padding: 0; margin: 0; }
    .exercise-grid li { min-width: 0; margin: 0; list-style: none; }
    .exercise-card {
      position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; min-height: 82px;
      padding: 10px; border: 1px solid var(--card-border); border-radius: 10px;
      background: var(--card-bg); text-decoration: none; transition: var(--transition);
    }
    .exercise-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-blue)); transform: scaleX(0);
      transform-origin: left; transition: transform .2s ease;
    }
    .exercise-card:hover { background: var(--card-hover-bg); border-color: rgba(255,215,0,.3); transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0,0,0,.24); }
    .exercise-card:hover::before { transform: scaleX(1); }
    .exercise-card:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 7px; }
    .card-title { flex: 1; color: var(--text-main); font-size: .78rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
    .difficulty-badge { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 2px 5px; border-radius: 5px; font-size: .58rem; font-weight: 700; text-transform: uppercase; color: #0a1428; }
    .difficulty-a1 { background: #34d399; } .difficulty-a2 { background: #10b981; }
    .difficulty-b1 { background: #f59e0b; } .difficulty-b2 { background: #fbbf24; }
    .difficulty-c1 { background: #facc15; } .difficulty-c2 { background: #ef4444; }
    .difficulty-unset { background: var(--text-muted); }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.06); font-size: .64rem; color: var(--text-muted); }
    .card-cta { display: flex; align-items: center; gap: 3px; color: var(--accent-gold); font-weight: 500; white-space: nowrap; transition: var(--transition); }
    .exercise-card:hover .card-cta { color: var(--accent-gold-hover); gap: 5px; }
    footer { border-top: 1px solid rgba(255,255,255,.08); padding: 14px 0; color: var(--text-muted); font-size: .68rem; text-align: center; }
    .footer-content { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
    .footer-stats { color: var(--text-secondary); font-weight: 500; }
    .footer-stats strong { color: var(--accent-gold); }
    .skip { position: absolute; left: -9999px; top: -9999px; z-index: -1; }
    .skip:focus { left: 16px; top: 16px; z-index: 1000; padding: 8px 14px; border-radius: 8px; background: var(--accent-gold); color: #0a1428; }
    @media (max-width: 1050px) { .exercise-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 760px) { .exercise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
    @media (max-width: 460px) {
      .container { padding: 0 12px; } header { padding: 13px 0 10px; } main { padding: 16px 0; }
      .exercise-grid { grid-template-columns: 1fr; }
      .filter-tags { gap: 4px; }
      .filter-btn { padding: 4px 2px; font-size: .64rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header>
    <div class="container">
      <div class="header-content">
        <div class="header-text">
          <h1>Escape Games</h1>
          <p>Immersive English learning through interactive scenarios</p>
        </div>
        <div class="controls" role="search">
          <div class="search-wrapper">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input id="search" class="search" type="search" placeholder="Search exercises…" aria-label="Search exercises" autocomplete="off" />
          </div>
          <div class="filter-tags">
            <button type="button" class="filter-btn active" data-level="all">All Levels</button>
            <button type="button" class="filter-btn" data-level="a1">A1</button>
            <button type="button" class="filter-btn" data-level="a2">A2</button>
            <button type="button" class="filter-btn" data-level="b1">B1</button>
            <button type="button" class="filter-btn" data-level="b2">B2</button>
            <button type="button" class="filter-btn" data-level="c1">C1</button>
            <button type="button" class="filter-btn" data-level="c2">C2</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main id="main" class="container">
    <ul id="exercises" class="exercise-grid" aria-live="polite" aria-busy="true">
      <li class="loading">Loading exercises…</li>
    </ul>
  </main>
  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-stats">Showing <strong id="count">0</strong> of <strong id="total">0</strong> exercises</div>
        <div>© 2024 Escape Games. English learning through immersion.</div>
      </div>
    </div>
  </footer>
  <script>
    (function() {
      const searchInput = document.getElementById('search');
      const exercisesList = document.getElementById('exercises');
      const countSpan = document.getElementById('count');
      const totalSpan = document.getElementById('total');
      const filterBtns = document.querySelectorAll('.filter-btn');
      let exercises = [];
      let currentLevel = 'all';

      function extractLevel(filename) {
        const match = filename.replace(/\.html$/i, '').match(/-(a1|a2|b1|b2|c1|c2)$/i);
        return match ? match[1].toLowerCase() : null;
      }
      function formatTitle(filename) {
        return filename.replace(/\.html$/i, '').replace(/-(a1|a2|b1|b2|c1|c2)$/i, '')
          .replace(/-/g, ' ').split(' ')
          .map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
      }
      function getLevelInfo(level) {
        const map = {
          a1: { label: 'A1', class: 'difficulty-a1' }, a2: { label: 'A2', class: 'difficulty-a2' },
          b1: { label: 'B1', class: 'difficulty-b1' }, b2: { label: 'B2', class: 'difficulty-b2' },
          c1: { label: 'C1', class: 'difficulty-c1' }, c2: { label: 'C2', class: 'difficulty-c2' }
        };
        return map[level] || { label: '—', class: 'difficulty-unset' };
      }
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
      function createExerciseCard(exercise) {
        const levelInfo = getLevelInfo(exercise.level);
        return `<a href="${escapeHtml(exercise.filename)}" class="exercise-card">
          <div class="card-header"><span class="card-title">${escapeHtml(exercise.title)}</span>
          <span class="difficulty-badge ${levelInfo.class}">${levelInfo.label}</span></div>
          <div class="card-meta"><span>Interactive Scenario</span><span class="card-cta">Start →</span></div>
        </a>`;
      }
      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        const visible = exercises.filter(exercise => {
          const matchesSearch = !query || exercise.title.toLowerCase().includes(query) ||
            (exercise.level && exercise.level.includes(query));
          return matchesSearch && (currentLevel === 'all' || exercise.level === currentLevel);
        });
        countSpan.textContent = visible.length;
        totalSpan.textContent = exercises.length;
        if (!exercises.length) {
          exercisesList.innerHTML = '<li class="empty">No exercises found. Check back soon!</li>';
        } else if (!visible.length) {
          exercisesList.innerHTML = '<li class="empty">No exercises match your filters.</li>';
        } else {
          exercisesList.innerHTML = visible.map(exercise => `<li>${createExerciseCard(exercise)}</li>`).join('');
        }
      }
      function debounce(fn, delay) {
        let timeoutId;
        return function(...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => fn.apply(this, args), delay);
        };
      }
      searchInput.addEventListener('input', debounce(applyFilters, 200));
      filterBtns.forEach(btn => btn.addEventListener('click', event => {
        filterBtns.forEach(button => button.classList.remove('active'));
        event.currentTarget.classList.add('active');
        currentLevel = event.currentTarget.getAttribute('data-level');
        applyFilters();
      }));
      window.addEventListener('keydown', event => {
        if (event.key === '/' && document.activeElement !== searchInput) {
          event.preventDefault();
          searchInput.focus();
        }
      });
      async function loadExercises() {
        try {
          exercisesList.setAttribute('aria-busy', 'true');
          const response = await fetch('https://api.github.com/repos/Balmain-English/escape-games/contents?t=' + Date.now(), {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });
          if (!response.ok) throw new Error(`Failed to fetch: ${response.status}`);
          const files = await response.json();
          exercises = (files || []).filter(file =>
            file.type === 'file' && file.name.endsWith('.html') &&
            !/^index\.html$/i.test(file.name) && !/^(README|CHANGELOG|LICENSE|styles|favicon)/i.test(file.name)
          ).sort((a, b) => a.name.localeCompare(b.name)).map(file => ({
            filename: file.name, title: formatTitle(file.name), level: extractLevel(file.name)
          }));
          exercisesList.setAttribute('aria-busy', 'false');
          totalSpan.textContent = exercises.length;
          applyFilters();
        } catch (error) {
          console.error('Error loading exercises:', error);
          exercisesList.setAttribute('aria-busy', 'false');
          exercisesList.innerHTML = `<li class="error"><strong>Unable to load exercises</strong><br><small>${escapeHtml(error.message)}</small></li>`;
        }
      }
      loadExercises();
    })();
  </script>
</body>
</html>
