<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escape Games — English Language Learning</title>
  <meta name="description" content="Interactive escape room games to practice English. Immersive scenarios for language learners at all levels." />
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      --page-bg: #071426;
      --page-bg-2: #0f1f34;
      --panel: rgba(16, 28, 44, 0.76);
      --panel-soft: rgba(21, 35, 56, 0.68);
      --panel-strong: rgba(27, 42, 66, 0.9);
      --border: rgba(176, 199, 228, 0.15);
      --border-strong: rgba(245, 208, 92, 0.45);
      --text: #edf4ff;
      --muted: #9badc8;
      --gold: #f4d060;
      --gold-strong: #f7c74b;
      --blue: #7fb2ff;
      --blue-2: #5da8ff;
      --shadow: rgba(4, 10, 17, 0.42);
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --ease: 200ms ease;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, Ubuntu, Cantarell, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124, 158, 228, 0.17), transparent 21%),
        radial-gradient(circle at top right, rgba(245, 208, 92, 0.12), transparent 20%),
        linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-2) 100%);
      letter-spacing: -0.01em;
    }

    a { color: inherit; }
    button, input { font: inherit; }
    .container { width: min(1280px, calc(100% - 36px)); margin: 0 auto; }

    .site-header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(7, 20, 38, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
    }

    .header-inner {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(360px, 480px);
      align-items: center;
      gap: 28px;
      min-height: 106px;
      padding: 16px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(245, 208, 92, 0.28), rgba(127, 178, 255, 0.12));
      border: 1px solid rgba(245, 208, 92, 0.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 8px 20px rgba(0,0,0,0.14);
      color: var(--gold-strong);
      font-size: 19px;
      flex-shrink: 0;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #f7f9ff;
    }

    .brand-tagline {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.81rem;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.75;
      pointer-events: none;
    }

    .search {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      transition: border-color var(--ease), background var(--ease), box-shadow var(--ease), transform var(--ease);
      outline: none;
    }

    .search::placeholder { color: rgba(155, 173, 200, 0.75); }
    .search:focus {
      border-color: rgba(245, 208, 92, 0.7);
      background: rgba(255, 255, 255, 0.065);
      box-shadow: 0 0 0 3px rgba(245, 208, 92, 0.12);
    }

    .filter-tags {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .filter-btn {
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: #dfeafc;
      font-size: 0.74rem;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      transition: transform var(--ease), border-color var(--ease), background var(--ease), color var(--ease), box-shadow var(--ease);
      white-space: nowrap;
    }

    .filter-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(245, 208, 92, 0.45);
      background: rgba(245, 208, 92, 0.07);
      color: var(--gold);
    }

    .filter-btn.active {
      border-color: rgba(245, 208, 92, 0.8);
      background: linear-gradient(135deg, var(--gold) 0%, #f5db80 100%);
      color: #13253d;
      box-shadow: 0 10px 18px rgba(245, 208, 92, 0.16);
    }

    .filter-btn:focus-visible,
    .exercise-card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    main {
      padding: 28px 0 36px;
      min-height: calc(100vh - 170px);
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .exercise-grid li {
      min-width: 0;
      margin: 0;
    }

    .exercise-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      height: 100%;
      padding: 14px 14px 12px;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, var(--panel-soft) 0%, rgba(17, 29, 45, 0.78) 100%);
      border: 1px solid var(--border);
      box-shadow: 0 10px 24px var(--shadow);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform var(--ease), border-color var(--ease), box-shadow var(--ease), background var(--ease);
    }

    .exercise-card::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--gold) 0%, var(--blue) 100%);
      opacity: 0;
      transition: opacity var(--ease);
    }

    .exercise-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      background: linear-gradient(180deg, rgba(24, 38, 58, 0.82) 0%, rgba(17, 27, 42, 0.78) 100%);
      box-shadow: 0 15px 28px rgba(0, 0, 0, 0.26);
    }

    .exercise-card:hover::before { opacity: 1; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      flex: 1;
      min-width: 0;
      font-size: 0.91rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.02em;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .difficulty-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-width: 32px;
      height: 22px;
      padding: 0 6px;
      border-radius: 7px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #11213b;
      background: var(--gold);
      border: 1px solid rgba(17, 33, 59, 0.2);
    }

    .difficulty-a1 { background: #65d8a7; }
    .difficulty-a2 { background: #48c892; }
    .difficulty-b1 { background: #f5bd55; }
    .difficulty-b2 { background: #f1d06a; }
    .difficulty-c1 { background: #f4dca4; }
    .difficulty-c2 { background: #ff8d8d; }
    .difficulty-unset { background: #a9b7cd; }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 0.71rem;
      letter-spacing: 0.01em;
    }

    .card-cta {
      color: var(--gold-strong);
      font-weight: 700;
      white-space: nowrap;
      transition: transform var(--ease), color var(--ease);
    }

    .exercise-card:hover .card-cta {
      color: #ffe48e;
      transform: translateX(2px);
    }

    .loading,
    .empty,
    .error {
      grid-column: 1 / -1;
      padding: 34px 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.025);
      color: var(--muted);
      text-align: center;
    }

    .loading {
      animation: pulse 1.8s ease-in-out infinite;
    }

    .error {
      border-color: rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.06);
      color: #f9b4b4;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    footer {
      padding: 18px 0 26px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.76rem;
    }

    .footer-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 16px;
      text-align: center;
    }

    .footer-stats { color: #dfe9fb; }
    .footer-stats strong { color: var(--gold); }

    .skip {
      position: absolute;
      left: -9999px;
      top: 14px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--gold);
      color: #0c1d2d;
      font-weight: 700;
      z-index: 50;
    }

    .skip:focus { left: 14px; }

    @media (max-width: 980px) {
      .header-inner {
        grid-template-columns: 1fr;
        gap: 14px;
        min-height: auto;
        padding: 18px 0;
      }
      .brand-tagline { white-space: normal; }
      .exercise-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .container { width: min(100% - 28px, 700px); }
      .exercise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .filter-tags { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      main { padding-top: 20px; }
    }

    @media (max-width: 480px) {
      .container { width: min(100% - 22px, 560px); }
      .brand { gap: 10px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 10px; }
      .exercise-grid { grid-template-columns: 1fr; }
      .filter-tags { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .exercise-card { min-height: 92px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand" aria-label="Escape Games home">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div class="brand-copy">
          <h1>Escape Games</h1>
          <p class="brand-tagline">Immersive English learning through interactive scenarios</p>
        </div>
      </div>

      <div class="controls" role="search" aria-label="Search and filter exercises">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" class="search" type="search" placeholder="Search exercises…" aria-label="Search exercises" autocomplete="off" />
        </div>

        <div class="filter-tags" aria-label="Filter exercises by level">
          <button type="button" class="filter-btn active" data-level="all" aria-pressed="true">All Levels</button>
          <button type="button" class="filter-btn" data-level="a1" aria-pressed="false">A1</button>
          <button type="button" class="filter-btn" data-level="a2" aria-pressed="false">A2</button>
          <button type="button" class="filter-btn" data-level="b1" aria-pressed="false">B1</button>
          <button type="button" class="filter-btn" data-level="b2" aria-pressed="false">B2</button>
          <button type="button" class="filter-btn" data-level="c1" aria-pressed="false">C1</button>
          <button type="button" class="filter-btn" data-level="c2" aria-pressed="false">C2</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <ul id="exercises" class="exercise-grid" aria-live="polite" aria-busy="true">
      <li class="loading">Loading exercises…</li>
    </ul>
  </main>

  <footer>
    <div class="container footer-content">
      <div class="footer-stats">Showing <strong id="count">0</strong> of <strong id="total">0</strong> exercises</div>
      <div>© 2024 Escape Games · English learning through immersion</div>
    </div>
  </footer>

  <script>
    (function() {
      const searchInput = document.getElementById('search');
      const exercisesList = document.getElementById('exercises');
      const countSpan = document.getElementById('count');
      const totalSpan = document.getElementById('total');
      const filterBtns = document.querySelectorAll('.filter-btn');

      let exercises = [];
      let currentLevel = 'all';

      function extractLevel(filename) {
        const match = filename.replace(/\.html$/i, '').match(/-(a1|a2|b1|b2|c1|c2)$/i);
        return match ? match[1].toLowerCase() : null;
      }

      function formatTitle(filename) {
        return filename.replace(/\.html$/i, '')
          .replace(/-(a1|a2|b1|b2|c1|c2)$/i, '')
          .replace(/-/g, ' ')
          .split(' ')
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');
      }

      function getLevelInfo(level) {
        const map = {
          a1: { label: 'A1', class: 'difficulty-a1' },
          a2: { label: 'A2', class: 'difficulty-a2' },
          b1: { label: 'B1', class: 'difficulty-b1' },
          b2: { label: 'B2', class: 'difficulty-b2' },
          c1: { label: 'C1', class: 'difficulty-c1' },
          c2: { label: 'C2', class: 'difficulty-c2' }
        };
        return map[level] || { label: '—', class: 'difficulty-unset' };
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function createExerciseCard(exercise) {
        const levelInfo = getLevelInfo(exercise.level);
        return `
          <a href="${escapeHtml(exercise.filename)}" class="exercise-card" role="link">
            <div class="card-header">
              <span class="card-title">${escapeHtml(exercise.title)}</span>
              <span class="difficulty-badge ${levelInfo.class}">${levelInfo.label}</span>
            </div>
            <div class="card-meta">
              <span>Interactive Scenario</span>
              <span class="card-cta">Explore →</span>
            </div>
          </a>
        `;
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();

        const visible = exercises.filter(exercise => {
          const matchesSearch = !query ||
            exercise.title.toLowerCase().includes(query) ||
            (exercise.level && exercise.level.includes(query));

          const matchesLevel = currentLevel === 'all' || exercise.level === currentLevel;
          return matchesSearch && matchesLevel;
        });

        countSpan.textContent = visible.length;
        totalSpan.textContent = exercises.length;

        if (!exercises.length) {
          exercisesList.innerHTML = '<li class="empty">No exercises available yet. Check back soon!</li>';
          return;
        }

        if (!visible.length) {
          exercisesList.innerHTML = '<li class="empty">No exercises match your filters.</li>';
          return;
        }

        exercisesList.innerHTML = visible
          .map(exercise => `<li>${createExerciseCard(exercise)}</li>`)
          .join('');
      }

      function debounce(fn, delay) {
        let timeoutId;
        return function(...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => fn.apply(this, args), delay);
        };
      }

      searchInput.addEventListener('input', debounce(applyFilters, 180));

      filterBtns.forEach(btn => {
        btn.addEventListener('click', event => {
          filterBtns.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
          });

          event.currentTarget.classList.add('active');
          event.currentTarget.setAttribute('aria-pressed', 'true');
          currentLevel = event.currentTarget.getAttribute('data-level');
          applyFilters();
        });
      });

      window.addEventListener('keydown', event => {
        if (event.key === '/' && document.activeElement !== searchInput) {
          event.preventDefault();
          searchInput.focus();
        }
      });

      async function loadExercises() {
        try {
          exercisesList.setAttribute('aria-busy', 'true');

          const response = await fetch(
            'https://api.github.com/repos/Balmain-English/escape-games/contents?t=' + Date.now(),
            {
              headers: {
                Accept: 'application/vnd.github.v3+json'
              }
            }
          );

          if (!response.ok) {
            throw new Error(`Failed to fetch: ${response.status}`);
          }

          const files = await response.json();

          exercises = (files || [])
            .filter(file =>
              file.type === 'file' &&
              file.name.endsWith('.html') &&
              !/^index\.html$/i.test(file.name) &&
              !/^(README|CHANGELOG|LICENSE|styles|favicon)/i.test(file.name)
            )
            .sort((a, b) => a.name.localeCompare(b.name))
            .map(file => ({
              filename: file.name,
              title: formatTitle(file.name),
              level: extractLevel(file.name)
            }));

          exercisesList.setAttribute('aria-busy', 'false');
          applyFilters();
        } catch (error) {
          console.error('Error loading exercises:', error);
          exercisesList.setAttribute('aria-busy', 'false');
          exercisesList.innerHTML = `
            <li class="error">
              <strong>Unable to load exercises</strong><br>
              <small>${escapeHtml(error.message)}</small>
            </li>
          `;
        }
      }

      loadExercises();
    })();
  </script>
</body>
</html>
