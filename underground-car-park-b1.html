<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underground Car Park - A2/B1 Language Game</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-yellow: #facc15;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .game-container {
      max-width: 680px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .low-batt { color: var(--accent-red); }
    .story-card {
      background: #334155;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .target-lang {
      background: rgba(56, 189, 248, 0.1);
      border-left: 4px solid var(--accent-blue);
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 0.9em;
      color: #bae6fd;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 14px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-blue);
      background: #0f172a;
    }
    .option-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .feedback-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }
    .btn-next {
      background: var(--accent-blue);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="status-bar">
    <div class="stat-item">⏱️ Time: <span id="time-val">20</span> min left</div>
    <div class="stat-item">🔋 Battery: <span id="batt-val">15</span>%</div>
    <div class="stat-item">⭐ Score: <span id="score-val">0</span> pts</div>
  </div>

  <div id="game-body">
    <div class="story-card">
      <div id="story-text">Loading situation...</div>
      <div id="lang-tip" class="target-lang"></div>
    </div>

    <div id="options" class="options-grid"></div>
    <div id="feedback" class="feedback-box"></div>
    <button id="next-btn" class="btn-next" onclick="nextStage()">Continue →</button>
  </div>
</div>

<script>
  const scenario = [
    {
      story: "It is 8:40 PM. The shopping mall is closing and the underground car park closes at 9:00 PM (20 minutes left!). You stand at the elevator on Level 0. You can't remember if your car is on Level -1 or Level -2. What do you do first?",
      tip: "Language Focus: Prepositions of place & reading parking tickets.",
      options: [
        {
          text: "Check your cinema ticket stub: It says 'Validated Parking - Level -2 (Cinema Section)'.",
          timeCost: 2, battCost: 0, score: 10, reqBatt: 0,
          feedback: "Great idea! Reading your ticket stub saves time and tells you exact level info. (+10 Score, -2 mins)"
        },
        {
          text: "Open your phone camera app and scan every level using photo history.",
          timeCost: 3, battCost: 6, score: 5, reqBatt: 6,
          feedback: "You find a photo from earlier, but scanning your gallery uses a lot of phone battery! (+5 Score, -3 mins, -6% Battery)"
        },
        {
          text: "Take the stairs down to Level -1 and walk around every parking row.",
          timeCost: 7, battCost: 0, score: 2, reqBatt: 0,
          feedback: "You walk across Level -1 for 7 minutes, but you can't find your car here. (-7 mins)"
        }
      ]
    },
    {
      story: "You arrive on Level -2. The floor is huge! There are three colored zones: Zone A (Blue - Supermarket), Zone B (Green - Cinema), and Zone C (Yellow - Gym). You see a security guard nearby.",
      tip: "Language Focus: Asking direct questions using 'Excuse me, where is...?'",
      options: [
        {
          text: "Ask the security guard: 'Excuse me, where is Zone B? Is it near the cinema exit?'",
          timeCost: 2, battCost: 0, score: 10, reqBatt: 0,
          feedback: "The guard answers: 'Zone B is straight ahead, opposite the green elevators.' Clear and helpful! (+10 Score, -2 mins)"
        },
        {
          text: "Turn on your phone's digital map application to find Zone B.",
          timeCost: 2, battCost: 5, score: 6, reqBatt: 5,
          feedback: "The app works, but underground signal searching drains your remaining battery! (+6 Score, -2 mins, -5% Battery)"
        },
        {
          text: "Walk towards Zone C (Yellow) because yellow is bright and easy to see.",
          timeCost: 6, battCost: 0, score: 2, reqBatt: 0,
          feedback: "Zone C is for Gym visitors. You walked in the wrong direction. (-6 mins)"
        }
      ]
    },
    {
      story: "You are in Zone B (Green). You remember your blue car was parked near a green pillar next to an emergency exit door.",
      tip: "Language Focus: Identifying spatial prepositions (next to, between, near).",
      options: [
        {
          text: "Look for the green pillar marked B4 next to the emergency exit sign.",
          timeCost: 2, battCost: 0, score: 10, reqBatt: 0,
          feedback: "Spot on! You see green pillar B4 next to the green emergency exit door. Your blue car is there! (+10 Score, -2 mins)"
        },
        {
          text: "Press the unlock button on your electronic car key repeatedly while walking past every row.",
          timeCost: 5, battCost: 0, score: 4, reqBatt: 0,
          feedback: "The signal is weak across the large floor. You find it eventually, but lose 5 minutes. (-5 mins)"
        },
        {
          text: "Search between rows B8 and B12 near the main entrance.",
          timeCost: 6, battCost: 0, score: 2, reqBatt: 0,
          feedback: "Rows B8 to B12 are far away from emergency exit doors. (-6 mins)"
        }
      ]
    },
    {
      story: "You find your car! You get inside, but before you drive to the exit gate, you see a notice sign on the pillar: 'NOTICE: ALL DRIVERS MUST PAY AT THE AUTOMATED MACHINE BEFORE DRIVING TO THE BARRIER.'",
      tip: "Language Focus: Understanding rules and obligation modals (must, have to, pay before).",
      options: [
        {
          text: "Walk to the pay machine near the elevator first: 'I must validate my parking ticket before driving.'",
          timeCost: 3, battCost: 0, score: 10, reqBatt: 0,
          feedback: "Correct rule compliance! You pay $4 at the machine and get your validated exit ticket. (+10 Score, -3 mins)"
        },
        {
          text: "Drive your car straight to the exit barrier and try to pay with cash at the gate.",
          timeCost: 8, battCost: 0, score: 1, reqBatt: 0,
          feedback: "The barrier sign says 'NO CASH AT BARRIER'. You have to reverse your car and walk back to the pay station! (-8 mins)"
        },
        {
          text: "Scan the payment QR code printed on the pillar using your phone payment app.",
          timeCost: 2, battCost: 4, score: 8, reqBatt: 4,
          feedback: "Quick digital payment! Your ticket is validated online. (+8 Score, -2 mins, -4% Battery)"
        }
      ]
    }
  ];

  let currentStage = 0;
  let time = 20;
  let battery = 15;
  let score = 0;

  function renderStage() {
    if (currentStage >= scenario.length || time <= 0) {
      endGame();
      return;
    }

    const data = scenario[currentStage];
    document.getElementById('story-text').innerText = data.story;
    document.getElementById('lang-tip').innerText = data.tip;
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';

    data.options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `${opt.text}`;
      
      if (battery < opt.reqBatt) {
        btn.disabled = true;
        btn.innerHTML += ` <em>(Requires ${opt.reqBatt}% battery - Phone too low)</em>`;
      }

      btn.onclick = () => selectOption(opt);
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(opt) {
    time = Math.max(0, time - opt.timeCost);
    battery = Math.max(0, battery - opt.battCost);
    score += opt.score;

    document.getElementById('time-val').innerText = time;
    const battElem = document.getElementById('batt-val');
    battElem.innerText = battery;
    if (battery <= 3) battElem.classList.add('low-batt');
    document.getElementById('score-val').innerText = score;

    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';
    feedback.style.background = opt.score >= 7 ? 'rgba(74, 222, 128, 0.15)' : 'rgba(248, 113, 113, 0.15)';
    feedback.style.border = opt.score >= 7 ? '1px solid #4ade80' : '1px solid #f87171';
    feedback.style.color = opt.score >= 7 ? '#86efac' : '#fca5a5';
    feedback.innerHTML = opt.feedback;

    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => b.disabled = true);

    document.getElementById('next-btn').style.display = 'inline-block';
  }

  function nextStage() {
    currentStage++;
    renderStage();
  }

  function endGame() {
    const container = document.getElementById('game-body');
    let title = "";
    let msg = "";

    if (time > 0) {
      title = "🚗 Successful Exit!";
      msg = `You found your car and exited the car park with <strong>${time} minutes</strong> before closing! <br><br><strong>Final Language Score: ${score}/40 points.</strong>`;
    } else {
      title = "🔒 Trapped Inside!";
      msg = `The car park shutters closed at 9:00 PM before you could exit.<br><br><strong>Final Language Score: ${score}/40 points.</strong>`;
    }

    container.innerHTML = `
      <div style="text-align: center; padding: 20px;">
        <h2>${title}</h2>
        <p style="line-height: 1.6;">${msg}</p>
        <button class="btn-next" style="display:inline-block; margin-top:15px;" onclick="location.reload()">Replay Scenario</button>
      </div>
    `;
  }

  renderStage();
</script>
</body>
</html>
